<text x="32" y="519" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">The ±0.256 LSE-D floor is not measured on this dataset: it is a single pair of regenerations of one production clip, n=1, carried here. It</text>
<text x="32" y="534" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">bounds what a same-build re-run of the same input moves the metric by, so a gap inside it cannot be told apart from re-encode noise — but it</text>
<text x="32" y="549" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">is one observation, not an interval, and it came from a different corpus. 8 clips clear it; the largest gap is +2.319 and the mean is +0.974.</text>
<text x="32" y="564" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">Ground truth is not a ceiling here: on 1 clip the generated video scores better than the real footage it came from, which is a fact about the</text>
<text x="32" y="579" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">metric.</text>
