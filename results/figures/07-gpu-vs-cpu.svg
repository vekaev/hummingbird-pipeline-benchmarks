<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="549" fill="#ffffff"/>
<text x="32" y="38" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#141920" text-anchor="start" font-weight="650" opacity="1">A sixth of a production job holds a GPU without using one</text>
<text x="32" y="60" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">Measured job-level timings, n=5, 6 and 12 runs. CPU-only means ffmpeg length adjustment, segment splitting and stitching, audio</text>
<text x="32" y="77" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">attachment, job setup and S3 transfers — every second of which is billed at the GPU machine rate.</text>
<line x1="272" y1="144" x2="272" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="272" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">0</text>
<line x1="337.7142857142857" y1="144" x2="337.7142857142857" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="337.7142857142857" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">100</text>
<line x1="403.42857142857144" y1="144" x2="403.42857142857144" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="403.42857142857144" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">200</text>
<line x1="469.1428571428571" y1="144" x2="469.1428571428571" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="469.1428571428571" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">300</text>
<line x1="534.8571428571429" y1="144" x2="534.8571428571429" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="534.8571428571429" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">400</text>
<line x1="600.5714285714286" y1="144" x2="600.5714285714286" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="600.5714285714286" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">500</text>
<line x1="666.2857142857142" y1="144" x2="666.2857142857142" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="666.2857142857142" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">600</text>
<line x1="732" y1="144" x2="732" y2="422" stroke="#dde2e9" stroke-width="1"/><text x="732" y="442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">700</text>
<text x="32" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">mean job seconds per video, all billed at the GPU machine rate</text>
<rect x="595.1" y="99" width="11" height="11" fill="#141920" rx="2"/>
<text x="612.1" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">needs the GPU</text>
<rect x="706.5" y="99" width="11" height="11" fill="#96450a" rx="2"/>
<text x="723.5" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">CPU-only: ffmpeg, transfers</text>
<text x="256" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#141920" text-anchor="end" font-weight="650" opacity="1">Production lipsync</text>
<text x="256" y="206" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">n=5 · 642.52 s job</text>
<rect x="272" y="175" width="347.5" height="34" fill="#141920" rx="2"/>
<rect x="619.5" y="175" width="74.7" height="34" fill="#96450a" rx="2"/>
<text x="284" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" opacity="1">GPU 528.80 s</text>
<text x="627.5" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" opacity="1">113.71 s</text>
<text x="704.2" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#96450a" text-anchor="start" font-weight="650" opacity="1">17.7% CPU-only</text>
<text x="256" y="278" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#141920" text-anchor="end" font-weight="650" opacity="1">Production word replacement</text>
<text x="256" y="294" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">n=6 · 186.19 s job</text>
<rect x="272" y="263" width="102.1" height="34" fill="#141920" rx="2"/>
<rect x="374.1" y="263" width="20.3" height="34" fill="#96450a" rx="2"/>
<text x="284" y="284" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" opacity="1">GPU 155.30 s</text>
<line x1="384.2" y1="297" x2="384.2" y2="309" stroke="#96450a" stroke-width="1"/>
<text x="384.2" y="323" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#96450a" text-anchor="middle" font-weight="600" opacity="1">30.89 s CPU-only</text>
<text x="404.4" y="284" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#96450a" text-anchor="start" font-weight="650" opacity="1">16.6% CPU-only</text>
<text x="256" y="366" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#141920" text-anchor="end" font-weight="650" opacity="1">HDTF self-driven</text>
<text x="256" y="382" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">n=12 · 362.94 s job</text>
<rect x="272" y="351" width="230.7" height="34" fill="#141920" rx="2"/>
<rect x="502.7" y="351" width="7.8" height="34" fill="#96450a" rx="2"/>
<text x="284" y="372" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" opacity="1">GPU 351.01 s</text>
<line x1="506.6" y1="385" x2="506.6" y2="397" stroke="#96450a" stroke-width="1"/>
<text x="506.6" y="411" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#96450a" text-anchor="middle" font-weight="600" opacity="1">11.93 s CPU-only</text>
<text x="520.5" y="372" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#96450a" text-anchor="start" font-weight="650" opacity="1">3.3% CPU-only</text>
<text x="32" y="471" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">The two production workloads spend 16.6–17.7% of their job on the CPU alone, dominated by downloading and re-encoding the source. The HDTF</text>
<text x="32" y="486" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">cohort falls to 3.3% only because its inputs are local 30 s clips rather than full-length customer uploads — an open-dataset benchmark</text>
<text x="32" y="501" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">understates this cost by construction. Measured job stages, classified by whether the stage needs a GPU at all; moving that work off the</text>
<text x="32" y="516" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">accelerator is a rate difference rather than a time saving, and it adds a network hop for the largest artefact in the job, which has not been</text>
<text x="32" y="531" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">measured.</text>
</svg>
