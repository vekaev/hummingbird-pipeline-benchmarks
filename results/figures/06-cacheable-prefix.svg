<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 503" width="900" height="503" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="503" fill="#ffffff"/>
<text x="32" y="38" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#141920" text-anchor="start" font-weight="650" opacity="1">Word replacement spends most of its pipeline re-analysing a video it has already seen</text>
<text x="32" y="60" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">Measured mean pipeline seconds, split at the animator: the four stages before it take no audio input, so for any job reusing a</text>
<text x="32" y="77" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">source video they recompute identical results. n=5 lipsync and n=6 word-replacement production runs.</text>
<line x1="262" y1="154" x2="262" y2="376" stroke="#dde2e9" stroke-width="1"/><text x="262" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">0</text>
<line x1="346.3333333333333" y1="154" x2="346.3333333333333" y2="376" stroke="#dde2e9" stroke-width="1"/><text x="346.3333333333333" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">100</text>
<line x1="430.66666666666663" y1="154" x2="430.66666666666663" y2="376" stroke="#dde2e9" stroke-width="1"/><text x="430.66666666666663" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">200</text>
<line x1="515" y1="154" x2="515" y2="376" stroke="#dde2e9" stroke-width="1"/><text x="515" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">300</text>
<line x1="599.3333333333333" y1="154" x2="599.3333333333333" y2="376" stroke="#dde2e9" stroke-width="1"/><text x="599.3333333333333" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">400</text>
<line x1="683.6666666666667" y1="154" x2="683.6666666666667" y2="376" stroke="#dde2e9" stroke-width="1"/><text x="683.6666666666667" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">500</text>
<line x1="768" y1="154" x2="768" y2="376" stroke="#dde2e9" stroke-width="1"/><text x="768" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">600</text>
<text x="32" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">mean pipeline seconds per video</text>
<rect x="565.7" y="99" width="11" height="11" fill="#1f4fd8" rx="2"/>
<text x="582.7" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">source-only prefix — cacheable</text>
<rect x="764.0" y="99" width="11" height="11" fill="#141920" rx="2"/>
<text x="781.0" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">audio-dependent</text>
<text x="246" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#141920" text-anchor="end" font-weight="650" opacity="1">Production lipsync</text>
<text x="246" y="220" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">n=5 measured runs</text>
<rect x="262" y="188" width="189.5" height="36" fill="#1f4fd8" rx="2"/>
<rect x="451.5" y="188" width="256.4" height="36" fill="#141920" rx="2"/>
<text x="274" y="211" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="650" opacity="1">42.5% cacheable</text>
<text x="717.9" y="211" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#141920" text-anchor="start" font-weight="600" opacity="1">528.77 s</text>
<text x="262" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">source-only prefix 224.70 s (42.5%) · audio-dependent remainder 304.06 s (57.5%)</text>
<text x="246" y="308" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#141920" text-anchor="end" font-weight="650" opacity="1">Production word replacement</text>
<text x="246" y="324" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">n=6 measured runs</text>
<rect x="262" y="292" width="76.7" height="36" fill="#1f4fd8" rx="2"/>
<rect x="338.7" y="292" width="46.4" height="36" fill="#141920" rx="2"/>
<line x1="300.4" y1="292" x2="300.4" y2="280" stroke="#1f4fd8" stroke-width="1"/>
<text x="300.4" y="275" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f4fd8" text-anchor="middle" font-weight="650" opacity="1">62.3% cacheable</text>
<text x="395.1" y="315" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#141920" text-anchor="start" font-weight="600" opacity="1">146.03 s</text>
<text x="262" y="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">source-only prefix 90.98 s (62.3%) · audio-dependent remainder 55.05 s (37.7%)</text>
<text x="32" y="425" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">The prefix share is 62.3% for word replacement against 42.5% for lipsync, because word replacement re-runs the entire source analysis to</text>
<text x="32" y="440" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">change a few seconds of speech. Measured seconds, but the saving is modelled and is an upper bound, not a result: a cache cannot hit until</text>
<text x="32" y="455" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">the frame time-warp RNG is seeded, and today nothing seeds it, so two runs on the same source do not produce reusable intermediates. The</text>
<text x="32" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">word-replacement cohort is also six replicas of one fixture — same source, same transcript, one changed segment — so it measures one workload</text>
<text x="32" y="485" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">six times rather than six workloads.</text>
</svg>
