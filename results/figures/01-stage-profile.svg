<text x="32" y="514" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">itself, the part a reader assumes this pipeline is — is 1.3%. The four stages in the prefix colour run before the animator and take no</text>
