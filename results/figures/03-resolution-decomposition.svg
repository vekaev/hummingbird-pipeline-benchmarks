<text x="350.9" y="325.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a92218" text-anchor="start" font-weight="650" opacity="1">Paste-back compositing: R² = 0.992 against megapixels</text>
<text x="350.9" y="342.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a92218" text-anchor="start" font-weight="400" opacity="1">slope 0.02850 s/frame/MPix over a fixed 0.00978 s/frame</text>
<text x="32" y="553" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">Every intermediate in this pipeline — the crop, the tracked geometry, the render itself — is written at 512² regardless of input size, so the</text>
<text x="32" y="568" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">flat lines are structural: those stages never see the source resolution. Paste-back is the only stage that composites back onto the original</text>
<text x="32" y="583" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">frame, and it is the only one that slopes. The next-best fit among the flat stages is Face crop at R² 0.533. That the flat stages come out flat</text>
<text x="32" y="598" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">is therefore a property of the design, and not evidence that the instrument is trustworthy. Measured, one run per clip; the fits are ordinary</text>
<text x="32" y="613" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">least squares through those points and the amber sample is inside them.</text>
</svg>
