<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 462" width="860" height="462" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="860" height="462" fill="#ffffff"/>
<text x="32" y="38" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#141920" text-anchor="start" font-weight="650" opacity="1">Videos per GPU-hour, which is the unit a capacity plan is written in</text>
<text x="32" y="60" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">Derived from measured pipeline seconds: n=5 lipsync and n=6 word-replacement production runs. Rate-independent, so it</text>
<text x="32" y="77" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">survives the fact that the GPU model behind the production runs is recorded nowhere.</text>
<line x1="292" y1="156" x2="292" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="292" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">0</text>
<line x1="356.2857142857143" y1="156" x2="356.2857142857143" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="356.2857142857143" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">10</text>
<line x1="420.57142857142856" y1="156" x2="420.57142857142856" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="420.57142857142856" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">20</text>
<line x1="484.85714285714283" y1="156" x2="484.85714285714283" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="484.85714285714283" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">30</text>
<line x1="549.1428571428571" y1="156" x2="549.1428571428571" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="549.1428571428571" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">40</text>
<line x1="613.4285714285714" y1="156" x2="613.4285714285714" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="613.4285714285714" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">50</text>
<line x1="677.7142857142857" y1="156" x2="677.7142857142857" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="677.7142857142857" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">60</text>
<line x1="742" y1="156" x2="742" y2="350" stroke="#dde2e9" stroke-width="1"/><text x="742" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="middle" font-weight="400" opacity="1">70</text>
<text x="32" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">videos per GPU-hour — rate-independent</text>
<rect x="570.9" y="99" width="11" height="11" fill="#141920" rx="2"/>
<text x="587.9" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">measured, as deployed</text>
<rect x="725.2" y="99" width="11" height="11" fill="#0a6146" rx="2"/>
<text x="742.2" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">modelled ceiling</text>
<text x="276" y="198" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#141920" text-anchor="end" font-weight="650" opacity="1">Lipsync</text>
<text x="276" y="214" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">as deployed · 528.77 s/video</text>
<rect x="292" y="187" width="43.8" height="26" fill="#141920" rx="2"/>
<text x="345.8" y="205" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#141920" text-anchor="start" font-weight="650" opacity="1">6.8</text>
<text x="276" y="258" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#141920" text-anchor="end" font-weight="650" opacity="1">Word replacement</text>
<text x="276" y="274" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">as deployed · 146.03 s/video</text>
<rect x="292" y="247" width="158.5" height="26" fill="#141920" rx="2"/>
<text x="460.5" y="265" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#141920" text-anchor="start" font-weight="650" opacity="1">24.7</text>
<text x="276" y="318" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0a6146" text-anchor="end" font-weight="650" opacity="1">Word replacement</text>
<text x="276" y="334" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5f6b79" text-anchor="end" font-weight="400" opacity="1">source prefix cached · 55.05 s/video</text>
<rect x="292" y="307" width="420.4" height="26" fill="#0a6146" rx="2"/>
<text x="722.4" y="325" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0a6146" text-anchor="start" font-weight="650" opacity="1">65.4</text>
<text x="304" y="325" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" opacity="1">upper bound</text>
<text x="32" y="399" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">This is the planning unit for hardware kept warm, and cold start is excluded by construction — amortised across a queue rather than</text>
<text x="32" y="414" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">billed per job. A job that pays the 285.41 s boot achieves none of these figures, and at the deployed 30 s cooldown most jobs pay it.</text>
<text x="32" y="429" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">The cached row is modelled rather than measured: it removes the source-only prefix outright, so it is the ceiling on a perfect cache —</text>
<text x="32" y="444" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b79" text-anchor="start" font-weight="400" opacity="1">2.65× the deployed word-replacement rate. Nothing seeds the frame time-warp RNG today, so that ceiling is not currently reachable.</text>
</svg>
